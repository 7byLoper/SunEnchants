enable: true
bootstrap:
  key: "sunenchants:mega_bulldozer"
  description: "Мега-Бур"
  max-level: 1
  weight: 10
  min-cost:
    base: 1
    per-level-above-first: 10
  max-cost:
    base: 20
    per-level-above-first: 10
  active-slots: "ANY"
display_name: "&7Мега-Бур {level}"
cursed: false
conflicts:
  - MENDING
on_message: '<#00FF00>[✓] <reset>%theme_color-3%Мега-бульдозер включён.<reset>'
off_message: '%theme_color-1%[✘] <reset>%theme_color-3%Мега-бульдозер выключен.<reset>'
target:
  - WOODEN_PICKAXE
  - STONE_PICKAXE
  - GOLDEN_PICKAXE
  - IRON_PICKAXE
  - DIAMOND_PICKAXE
  - NETHERITE_PICKAXE
  - WOODEN_SHOVEL
  - STONE_SHOVEL
  - GOLDEN_SHOVEL
  - IRON_SHOVEL
  - DIAMOND_SHOVEL
  - NETHERITE_SHOVEL
  - WOODEN_AXE
  - STONE_AXE
  - GOLDEN_AXE
  - IRON_AXE
  - DIAMOND_AXE
  - NETHERITE_AXE
# Сколько блоков бульдозер ломает за один тик; остаток доламывается на следующих тиках.
max_blocks_per_tick: 64
max_level: 1
blocked_worlds:
  - spawn
levels:
  1:
    chances:
      table_enchant: 0
      work: 100
    sounds:
      alone: ""
      around: ""
    value: 2
